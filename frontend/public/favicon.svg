<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ORCA">
  <!-- The mark: an orbital ring around a planet limb, with the rescue vehicle on the ring.
       Drawn as geometry rather than a glyph so it stays crisp at 16px. -->
  <rect width="32" height="32" rx="7" fill="#05070d"/>
  <circle cx="16" cy="18.5" r="7.5" fill="none" stroke="#4a90d6" stroke-width="1.6"/>
  <ellipse cx="16" cy="16" rx="12" ry="4.6" fill="none" stroke="#4ac9d6" stroke-width="1.3"
           transform="rotate(-22 16 16)"/>
  <circle cx="26.2" cy="12.1" r="2.1" fill="#4ac9d6"/>
</svg>
